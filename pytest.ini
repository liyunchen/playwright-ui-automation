[pytest]
# 用例目录：code_testcases 为平台约定的代码用例扫描目录
testpaths = code_testcases
python_files = test_*.py
python_classes = Test*
python_functions = test_*
#核心：指定 Allure 源文件输出目录
addopts = -s --alluredir=reports/allure-results --reruns=0 --reruns-delay=3
markers =
    smoke: 冒烟测试用例
    login: 登录模块用例
    ui: UI 自动化测试用例
    api: 接口自动化测试用例
    # 业务模块 marker（用于 pytest -m project 这类按模块过滤）
    project: 项目管理模块
    testcase_mgmt: 用例管理模块
    api_catalog: 接口管理模块
    environment: 环境管理模块